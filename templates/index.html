<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>湧くナビ</title>
  <link rel="icon" href="/static/img/icon-water.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    #map {
      height: 100vh;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="search-container">
    <input type="text" id="searchBox" placeholder="地名を入力">
  </div>
  <!-- 地図を表示するためのdiv -->
  <div id="map"></div>

  <div id="modal" class="modal">
    <div class="modal-content">
      <span id="modal-close" class="modal-close">&times;</span>
      <h2 id="modal-title">湧水名</h2>
      <p id="modal-description">詳細情報</p>
    </div>
  </div>
  <button  id="trackingBtn" onclick="toggleTracking()" class="locate-btn">📍現在地</button>
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <script src="{{ url_for('static', filename='js/spring_water.js') }}"></script>
  <script src="{{ url_for('static', filename='js/location_and_route.js') }}"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>  

</body>
</html>
